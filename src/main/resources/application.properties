spring.application.name=UniversityGroups

spring.datasource.url=jdbc:mysql://localhost:3306/scale_apps?createDatabaseIfNotExist=true
spring.datasource.username=mysql
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.show-sql=true

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=scale_apps
spring.liquibase.url=jdbc:mysql://localhost:3306/scale_apps
spring.liquibase.user=mysql
spring.liquibase.password=mysql
spring.liquibase.driver-class-name=com.mysql.cj.jdbc.Driver